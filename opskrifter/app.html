<title>Min Kogebog</title>

<style>
/* Layout: én kolonne, telefon først. Lyst, luftigt tema: hvide kort på kølig lys grund, bløde skygger,
   stor titel, pastelfarvede kategorier og en frisk grøn accent. Bevidst kun lyst tema. */
:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --ink: #111418;
  --ink-soft: #6b7280;
  --line: #e4e7ec;
  --accent: #10a35a;
  --accent-ink: #ffffff;
  --accent-soft: #e3f6ec;
  --warm: #e5532d;
  --danger: #ef3b36;
  --shadow: 0 1px 2px rgb(16 24 40 / .04), 0 6px 20px rgb(16 24 40 / .06);
  --shadow-lg: 0 10px 30px rgb(16 24 40 / .12);
  --font: "Plus Jakarta Sans", "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 20px;
  /* Kategorifarver */
  --c-morgen: #fff2c6; --c-morgen-ink: #8a5a00;
  --c-middag: #dff0ff; --c-middag-ink: #1d5f99;
  --c-aften: #dcf5e6; --c-aften-ink: #0b7a44;
  --c-dessert: #ffe1ea; --c-dessert-ink: #b0315a;
  --c-drink: #ebe5ff; --c-drink-ink: #5a3fc0;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: rgb(245 246 248 / .85); }
h1, h2, h3 { font-family: var(--font); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgb(245 246 248 / .82); -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; min-height: 58px; }

.brand.big { font-size: 2rem; font-weight: 800; letter-spacing: -0.035em; padding-top: 6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px rgb(16 163 90 / .28); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { color: var(--danger); }
.btn.icon { width: 44px; padding: 0; }
.topbar .btn.icon { background: var(--surface); box-shadow: var(--shadow); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }

main { padding-block: 8px calc(env(safe-area-inset-bottom, 0px) + 120px); }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* Liste */
.search { width: 100%; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 14px 18px; }
.search::placeholder { color: var(--ink-soft); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; margin-inline: -2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface-2); border-radius: 999px; padding: 8px 15px; font-size: .9rem; font-weight: 600; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip .n { opacity: .5; margin-left: 6px; font-variant-numeric: tabular-nums; font-weight: 500; }
.chips.multi { flex-wrap: wrap; overflow: visible; }
.cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr; } }

.swipe { position: relative; border-radius: var(--radius); }
.swipe .under { position: absolute; inset: 0; border: 0; border-radius: var(--radius); background: var(--danger); color: #fff; font-weight: 700; font-size: .8rem; cursor: pointer; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; padding-right: 26px; visibility: hidden; }
.swipe .under svg { width: 24px; height: 24px; margin-right: 8px; }
.swipe .under span { margin-right: 6px; }
.swipe:has(.card.open) .under, .swipe:has(.card.dragging) .under { visibility: visible; }
.card { position: relative; display: grid; grid-template-columns: 60px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; text-align: left; cursor: pointer; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.card.dragging { transition: none; }
.card > div { min-width: 0; }
.mono { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 1.4rem; background: var(--surface-2); color: var(--ink-soft); overflow: hidden; }
.mono[data-ci="0"] { background: var(--c-morgen); color: var(--c-morgen-ink); }
.mono[data-ci="1"] { background: var(--c-middag); color: var(--c-middag-ink); }
.mono[data-ci="2"] { background: var(--c-aften); color: var(--c-aften-ink); }
.mono[data-ci="3"] { background: var(--c-dessert); color: var(--c-dessert-ink); }
.mono[data-ci="4"] { background: var(--c-drink); color: var(--c-drink-ink); }
.mono img { width: 60px; height: 60px; object-fit: cover; display: block; }
.card h3 { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; }
.card .meta { color: var(--ink-soft); font-size: .84rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta span + span::before { content: "·"; margin: 0 8px; opacity: .6; }
.tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.section-label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.hint { font-size: .85rem; color: var(--ink-soft); margin: 0; }
.status { font-size: .8rem; color: var(--ink-soft); }

.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 6; }
.plus { width: 66px; height: 66px; border-radius: 50%; border: 4px solid var(--bg); background: var(--ink); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow-lg); transition: transform .2s ease; }
.plus svg { width: 28px; height: 28px; }
.plus:active { transform: scale(.94); }
.plus[aria-expanded="true"] { transform: rotate(45deg); }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgb(17 20 24 / .28); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; animation: up .26s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow-lg); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 6px; }
.sheet h2 { font-size: 1.25rem; font-weight: 800; padding: 0 4px 4px; }
.opt { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; border: 0; background: var(--bg); border-radius: 18px; padding: 14px; cursor: pointer; text-decoration: none; color: var(--ink); }
.opt:active { background: var(--surface-2); }
.opt .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.opt .ic svg { width: 24px; height: 24px; }
.opt b { display: block; font-size: 1rem; }
.opt span span { color: var(--ink-soft); font-size: .85rem; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }

#cloudbtn[data-on="true"] { color: var(--accent); }
.fav { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: #b7bcc5; }
.topbar .fav { background: var(--surface); box-shadow: var(--shadow); }
.fav svg { width: 22px; height: 22px; }
.fav[aria-pressed="true"] { color: var(--danger); }
.fav[aria-pressed="true"] svg { fill: currentColor; }

.chip.add { background: transparent; border: 1.5px dashed var(--line); color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
.chip.add svg { width: 14px; height: 14px; }
.addcat { display: flex; gap: 8px; }
.addcat .input { flex: 1; min-width: 0; }
.catlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.catlist li { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 14px; padding: 6px 6px 6px 14px; font-weight: 600; }
.catlist li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catlist .x { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--danger); cursor: pointer; display: grid; place-items: center; }
.catlist .x svg { width: 18px; height: 18px; }
.group-label { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 4px 2px -4px; grid-column: 1 / -1; }
.match { display: block; font-size: .8rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match .ok { color: var(--accent); font-weight: 600; }
.match .no { color: var(--warm); }
.search-wrap { display: flex; flex-direction: column; gap: 6px; }

.cartbtn { position: relative; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .72rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.shoppick { list-style: none; margin: 0; padding: 0; max-height: 52vh; overflow-y: auto; }
.shoppick li { display: grid; grid-template-columns: 26px minmax(60px, auto) 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.shoppick li:last-child { border-bottom: 0; }
.shoppick li:not(.have) .box { background: var(--accent); border-color: var(--accent); }
.shoppick li:not(.have) .box::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.shoppick li.have .qty, .shoppick li.have .name { opacity: .45; text-decoration: line-through; }
.shoppick .qty { font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.shoppick .havelbl { font-size: .75rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
.shoppick .havelbl:empty { display: none; }
.ings.shop li { grid-template-columns: 26px minmax(56px, auto) 1fr auto 32px; align-items: center; }
.aisle { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 14px 0 0; }
.panel h2 + .aisle { margin-top: 4px; }
.offer { font-size: .72rem; font-weight: 700; color: var(--warm); background: #fff1ec; border-radius: 999px; padding: 4px 9px; text-decoration: none; white-space: nowrap; }
.ings.shop small { display: block; color: var(--ink-soft); font-size: .75rem; }
.ings.shop .x { width: 36px; height: 36px; border: 0; background: transparent; color: var(--ink-soft); font-size: 1.4rem; line-height: 1; cursor: pointer; border-radius: 50%; }
.panel h2 .n { font-size: .85rem; color: var(--ink-soft); font-weight: 600; margin-left: 4px; }

/* Opskrift */
.recipe-head { display: flex; flex-direction: column; gap: 10px; }
.recipe-head h1 { font-size: clamp(1.9rem, 8vw, 2.7rem); font-weight: 800; letter-spacing: -0.035em; }
.recipe-head p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
.hero { width: 100%; max-height: 320px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 24px; background: var(--surface-2); box-shadow: var(--shadow); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; font-size: .85rem; }
.facts > span { background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px; color: var(--ink-soft); }
.facts b { color: var(--ink); font-weight: 600; }
.pill-cat { align-self: flex-start; border-radius: 999px; padding: 4px 12px; font-size: .78rem; font-weight: 700; background: var(--surface-2); color: var(--ink-soft); }
.pill-cat[data-ci="0"] { background: var(--c-morgen); color: var(--c-morgen-ink); }
.pill-cat[data-ci="1"] { background: var(--c-middag); color: var(--c-middag-ink); }
.pill-cat[data-ci="2"] { background: var(--c-aften); color: var(--c-aften-ink); }
.pill-cat[data-ci="3"] { background: var(--c-dessert); color: var(--c-dessert-ink); }
.pill-cat[data-ci="4"] { background: var(--c-drink); color: var(--c-drink-ink); }

.scaler { background: var(--accent-soft); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.scaler-main { display: flex; align-items: center; gap: 12px; }
.scaler-main .lbl { flex: 1; min-width: 0; font-size: .9rem; font-weight: 600; color: var(--c-aften-ink); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font-size: 1.4rem; line-height: 1; cursor: pointer; }
.stepper input { width: 60px; text-align: center; background: transparent; border: 0; color: var(--ink); font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.scaler .chip { background: rgb(255 255 255 / .7); }
.scaler .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
.unitname { font-size: .95rem; font-weight: 600; color: var(--c-aften-ink); }

.panel { background: var(--surface); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); }
.panel h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
.ings { list-style: none; margin: 0; padding: 0; }
.ings li { display: grid; grid-template-columns: 26px minmax(70px, auto) 1fr; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.ings li:last-child { border-bottom: 0; }
.ings li.sec { display: block; cursor: default; padding-top: 18px; border-bottom: 0; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.ings .qty { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.ings .qty.scaled { color: var(--accent); }
.ings .name { min-width: 0; }
.box { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 7px; align-self: center; display: grid; place-items: center; }
li.done .box, .steps li.done .num { background: var(--accent); border-color: var(--accent); }
li.done .box::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
li.done .name, li.done .qty, .steps li.done .txt { opacity: .4; text-decoration: line-through; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; cursor: pointer; }
.steps .num { width: 34px; height: 34px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; border: 2px solid transparent; }
.steps li.done .num { color: #fff; }
.steps .txt { padding-top: 5px; max-width: 65ch; }
.notes { white-space: pre-wrap; margin: 0; color: var(--ink-soft); }

/* Formularer */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .flabel { font-weight: 600; font-size: .9rem; }
.field .hint { font-size: .8rem; }
.input, textarea.input { width: 100%; border: 1.5px solid transparent; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 12px 14px; }
.input:focus { outline: none; border-color: var(--accent); }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.45; }
textarea.tall { min-height: 220px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > * { min-width: 0; }
.seg { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 9px 10px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.note { font-size: .88rem; color: var(--ink-soft); background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 12px 14px; margin: 0; }
.note.err { color: var(--danger); background: #fff1f0; box-shadow: none; }
.preview-ing { font-size: .85rem; color: var(--ink-soft); margin: 0; padding-left: 18px; }
.check { display: flex; gap: 10px; align-items: center; font-size: .92rem; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: #fff1f0; border-radius: 16px; padding: 10px 12px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.linkrow { display: flex; gap: 8px; }
.linkrow .input { flex: 1; min-width: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 16px; font-weight: 600; z-index: 20; font-size: .9rem; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-lg); }
.toast button { border: 0; background: transparent; color: #7ee2ad; font-weight: 700; cursor: pointer; padding: 4px; }
.spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .sheet { animation: none; } .card, .plus { transition: none; } }
</style>

<script>
(() => {
"use strict";

/* ---------- Små hjælpere ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  paste: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h2"/></svg>',

const UNIT_ALIASES = {

  ml: ["ml", "milliliter"], cl: ["cl", "centiliter"], dl: ["dl", "deciliter"], l: ["l", "liter", "litre", "liters"],
  tsk: ["tsk", "tsk.", "teske", "teskefuld", "tsp", "tsp.", "teaspoon", "teaspoons", "tl"],
  spsk: ["spsk", "spsk.", "spiseske", "spiseskefuld", "tbsp", "tbsp.", "tablespoon", "tablespoons", "tbs", "el"],
  knsp: ["knsp", "knsp.", "knivspids", "pinch"],
  stk: ["stk", "stk.", "styk", "stykker"], fed: ["fed", "clove", "cloves"],
  dåse: ["dåse", "dåser", "ds", "ds.", "can", "cans"], pk: ["pk", "pk.", "pakke", "pakker", "pakning"],
  bdt: ["bdt", "bdt.", "bundt", "bundter", "bunch"], skive: ["skive", "skiver", "slice", "slices"],
  håndfuld: ["håndfuld", "håndfulde", "handful"], dråbe: ["dråbe", "dråber", "drop", "drops"],
  /* Amerikanske mål omregnes ved indlæsning */
  cup: ["cup", "cups", "c."], oz: ["oz", "ounce", "ounces"], lb: ["lb", "lbs", "pound", "pounds"], floz: ["fl oz", "fl. oz", "fl.oz"],
  stick: ["stick", "sticks"], qt: ["quart", "quarts", "qt"], pt: ["pint", "pints", "pt"]

const UNIT_LOOKUP = {};
for (const [k, list] of Object.entries(UNIT_ALIASES)) for (const a of list) UNIT_LOOKUP[a.toLowerCase()] = k;
const US_TO_METRIC = { cup: [2.4, "dl"], oz: [28, "g"], lb: [450, "g"], floz: [30, "ml"], stick: [113, "g"], qt: [9.5, "dl"], pt: [4.7, "dl"] };

const VULGAR = { "½": .5, "⅓": 1/3, "⅔": 2/3, "¼": .25, "¾": .75, "⅕": .2, "⅛": .125, "⅜": .375, "⅝": .625, "⅞": .875 };
const NUM_RE = "(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?(?:\\s*[½⅓⅔¼¾⅕⅛⅜⅝⅞])?|[½⅓⅔¼¾⅕⅛⅜⅝⅞])";
function parseNum(s) {
  s = s.trim();

  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)\s*([½⅓⅔¼¾⅕⅛⅜⅝⅞])$/))) return parseFloat(m[1].replace(",", ".")) + VULGAR[m[2]];
  if (VULGAR[s] != null) return VULGAR[s];

  return isNaN(n) ? null : n;
}
/* "2-3 spsk olivenolie" -> {amount:2, amountMax:3, unit:"spsk", name:"olivenolie"} */
function parseIngredientLine(line) {
  let s = line.replace(/^\s*[-•*·–]\s*/, "").replace(/\s+/g, " ").trim();
  if (!s) return null;
  if (/:$/.test(s) && s.length < 60) return { section: s.replace(/:$/, "").trim() };
  const re = new RegExp("^(" + NUM_RE + ")(?:\\s*[-–]\\s*(" + NUM_RE + "))?\\s*(.*)$");
  const m = s.match(re);

    amount = parseNum(m[1]);

    rest = m[3];

  if (amount != null) {
    const low = rest.toLowerCase();
    if (low.startsWith("fl oz") || low.startsWith("fl. oz") || low.startsWith("fl.oz")) {

      if (w && UNIT_LOOKUP[w[1].toLowerCase()]) { unit = UNIT_LOOKUP[w[1].toLowerCase()]; rest = w[2]; }
      else if (w && UNIT_LOOKUP[w[1].toLowerCase().replace(/\.$/, "")]) { unit = UNIT_LOOKUP[w[1].toLowerCase().replace(/\.$/, "")]; rest = w[2]; }

/* Fælles mål: amerikanske mål til metrisk, tsk/spsk/dl osv. bevares */
function normalizeIngredient(ing) {

  let amount = toNum(ing.amount), amountMax = toNum(ing.amountMax);
  let unit = String(ing.unit || "").trim();
  const canon = UNIT_LOOKUP[unit.toLowerCase()] || unit;
  unit = canon;
  if (US_TO_METRIC[unit] && amount != null) {
    const [f, u] = US_TO_METRIC[unit];

/* Vælg den mest læsbare enhed efter skalering */
function bestUnit(q, unit) {
  if (unit === "g" && q >= 1000) return [q / 1000, "kg"];
  if (unit === "kg" && q < 1) return [q * 1000, "g"];
  if (unit === "ml" && q >= 1000) return [q / 1000, "l"];
  if (unit === "ml" && q >= 100) return [q / 100, "dl"];
  if (unit === "cl" && q >= 10) return [q / 10, "dl"];
  if (unit === "dl" && q >= 10) return [q / 10, "l"];
  if (unit === "dl" && q < 0.5) return [q * 100, "ml"];
  if (unit === "l" && q < 1) return [q * 10, "dl"];
  if (unit === "tsk" && q >= 6) return [q / 3, "spsk"];

const FRACS = [[0, ""], [1/4, "¼"], [1/3, "⅓"], [1/2, "½"], [2/3, "⅔"], [3/4, "¾"], [1, ""]];
function fmtNum(q, unit) {
  if (q == null) return "";

  if (unit === "g" || unit === "ml") {
    if (q >= 100) return String(Math.round(q / 5) * 5);

  let best = FRACS[0], diff = 1;
  for (const f of FRACS) { const d = Math.abs(frac - f[0]); if (d < diff) { diff = d; best = f; } }

}

  if (ing.amount == null) return "";
  let a = ing.amount * factor, b = ing.amountMax != null ? ing.amountMax * factor : null;
  const [qa, u] = bestUnit(a, ing.unit);
  const qb = b != null && a ? b * (qa / a) : null;
  const ua = u ? " " + u : "";

}

/* Tekst -> trin: fjern nummerering, del på tomme linjer eller linjeskift */
function parseSteps(text) {
  const raw = String(text || "").replace(/\r/g, "");
  let parts = raw.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean);
  if (parts.length <= 1) parts = raw.split(/\n/).map((s) => s.trim()).filter(Boolean);
  return parts.map((s) => s.replace(/^(?:trin\s*)?\d+[.):]\s*/i, "").replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
}

/* Simpel lokal fortolkning af indsat tekst (bruges når Claude ikke er tilgængelig) */
function heuristicParse(text) {
  const lines = String(text).replace(/\r/g, "").split("\n").map((l) => l.trim());
  const isIngHead = (l) => /^(ingredienser|ingredients|du skal bruge|det skal du bruge)\b/i.test(l);
  const isStepHead = (l) => /^(fremgangsmåde|sådan gør du|tilberedning|instructions|method|directions|preparation|opskrift)\b/i.test(l);
  const isNoteHead = (l) => /^(tips?|noter|bemærk|notes?)\b/i.test(l);
  let title = lines.find((l) => l && !isIngHead(l) && !isStepHead(l) && l.length < 90) || "Ny opskrift";
  let servings = 4, unit = "personer";
  const sm = text.match(/(\d+)\s*(personer|pers\.?|portioner|servings|serves|people|stk\.?|styk)/i) || text.match(/(?:serves|til|portioner:?)\s*(\d+)/i);
  if (sm) { servings = +sm[1]; if (sm[2] && /stk|styk/i.test(sm[2])) unit = "stk."; else if (sm[2] && /portion/i.test(sm[2])) unit = "portioner"; }
  let mode = "", ings = [], steps = [], notes = [];
  for (const l of lines) {
    if (!l) { if (mode === "steps") steps.push(""); continue; }
    if (isIngHead(l)) { mode = "ings"; continue; }
    if (isStepHead(l)) { mode = "steps"; continue; }
    if (isNoteHead(l)) { mode = "notes"; continue; }
    if (mode === "ings") ings.push(l);
    else if (mode === "steps") steps.push(l);
    else if (mode === "notes") notes.push(l);
  }
  if (!ings.length) ings = lines.filter((l) => new RegExp("^" + NUM_RE).test(l) && l.length < 80);
  return {
    title, servings, servingsUnit: unit, time: "", category: "", description: "",
    ingredients: ings.map(parseIngredientLine).filter(Boolean),
    steps: parseSteps(steps.join("\n")), notes: notes.join("\n")
  };
}

function loadScript(src) {

async function loadFirebase() {

/* Læser opsætningen fra Firebase-konsollen: accepterer både JSON og "const firebaseConfig = { apiKey: "…", … }" */
function parseFirebaseConfig(text) {
  const out = {};
  for (const k of ["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"]) {
    const m = String(text).match(new RegExp('["\']?' + k + '["\']?\\s*:\\s*["\']([^"\']+)["\']'));
    if (m) out[k] = m[1];
  }

}

async function initCloud() {

  /* Vis den gemte kopi med det samme, mens skyen svarer */

    const fs = app.firestore();
    if (!initCloud.persist) { initCloud.persist = true; try { await fs.enablePersistence({ synchronizeTabs: true }); } catch {} }
    S.col = fs.collection("kogeboeger").doc(c.code).collection("opskrifter");

      if (!snap.metadata.fromCache) { clearTimeout(slowTimer); S.slow = false; }

/* Første gang en telefon kobles på, lægges dens egne opskrifter op i den fælles kogebog */
async function uploadLocalOnce(code) {
  const flag = "mk:uploaded:" + code;
  if (lsGet(flag, false)) return;
  const mine = lsGet("mk:recipes", []);
  const cats = lsGet("mk:cats", []);
  try {
    const existing = await S.col.get();
    const ids = new Set(existing.docs.map((d) => d.id));
    const batch = S.col.firestore.batch();
    let n = 0;
    for (const r of mine) if (r && r.id && !ids.has(r.id)) { batch.set(S.col.doc(r.id), JSON.parse(JSON.stringify(r))); n++; }
    const old = existing.docs.find((d) => d.id === SETTINGS_ID);
    const od = (old && old.data()) || {};
    const merged = [...new Set([...(od.customCategories || []), ...cats])];
    const hidden = [...new Set([...(od.hiddenCategories || []), ...lsGet("mk:hiddenCats", [])])];
    if (merged.length) batch.set(S.col.doc(SETTINGS_ID), { customCategories: merged, hiddenCategories: [], v: 2 });
    await batch.commit();
    lsSet(flag, true);
    if (n) toast(n + (n === 1 ? " opskrift" : " opskrifter") + " fra denne telefon er lagt i den fælles kogebog");
  } catch {}
}

/* Fælles for kogebog på claude.ai og fælles kogebog: dokumenter der starter med _ er indstillinger */
function applySnapshot(snap) {
  const settings = snap.docs.find((d) => d.id === SETTINGS_ID);

async function saveRecipe(r, keepTime) {

/* ---------- Indkøbsseddel ---------- */
/* Én fælles liste (deles også i den fælles kogebog). Samme vare fra flere opskrifter lægges sammen.
   "Har allerede"-varer huskes, så fx salt og olie er fravalgt næste gang. */
const SHOP_ID = "_indkob";
const PANTRY_DEFAULT = ["vand", "salt", "peber", "salt og peber", "isvand", "lunkent vand", "koldt vand", "kogende vand"];
const shopKeyName = (n) => String(n || "").toLowerCase().split(",")[0].replace(/\(.*?\)/g, "").replace(/\s+/g, " ").trim();
const BASE_UNIT = { g: ["g", 1], kg: ["g", 1000], ml: ["ml", 1], cl: ["ml", 10], dl: ["ml", 100], l: ["ml", 1000], tsk: ["tsk", 1], spsk: ["tsk", 3] };
function toBase(amount, unit) { const b = BASE_UNIT[unit]; return b && amount != null ? [amount * b[1], b[0]] : [amount, unit]; }
function readShop(d) {
  S.shop = Array.isArray(d.items) ? d.items : [];
  if (Array.isArray(d.pantry)) S.pantry = d.pantry;
  lsSet("mk:shop", S.shop); lsSet("mk:pantry", S.pantry);
}
function saveShop() {
  lsSet("mk:shop", S.shop); lsSet("mk:pantry", S.pantry);
  const body = { items: JSON.parse(JSON.stringify(S.shop)), pantry: S.pantry };
  if (S.mode === "cloud") S.col.doc(SHOP_ID).set(body).catch(() => toast("Indkøbssedlen kunne ikke gemmes."));
  else if (S.mode === "db") S.col.doc(SHOP_ID).set(body).catch(() => toast("Indkøbssedlen kunne ikke gemmes."));
}
const inPantry = (name) => { const k = shopKeyName(name); return S.pantry.includes(k) || (!S.pantryTouched?.has(k) && PANTRY_DEFAULT.includes(k)); };
function addToShop(lines, title) {
  let added = 0;
  for (const ing of lines) {
    const k = shopKeyName(ing.name);
    if (!k) continue;
    const [amt, unit] = toBase(ing.amount, ing.unit);
    const hit = S.shop.find((x) => !x.done && x.k === k && x.unit === unit && (x.amount == null) === (amt == null));
    if (hit) {
      if (amt != null) hit.amount += amt;
      if (title && !hit.from.includes(title)) hit.from.push(title);
    } else {
      S.shop.push({ id: uid(), k, name: String(ing.name).split(",")[0].trim(), amount: amt, unit: unit || "", from: title ? [title] : [], done: false });
    }
    added++;
  }
  saveShop();
  return added;
}
const shopQty = (x) => fmtQty({ amount: x.amount, amountMax: null, unit: x.unit }, 1);
const shopCount = () => S.shop.filter((x) => !x.done).length;

/* Arket på en opskrift: vælg hvad der skal købes */
function openShopSheet(r, factor, cur) {
  const ings = (r.ingredients || []).map((ing, i) => ({ ing, i })).filter((x) => !x.ing.section && x.ing.name);
  const need = new Set(ings.filter((x) => !inPantry(x.ing.name)).map((x) => x.i));
  const draw = () => {
    $("#sheet").innerHTML = `<div class="sheet-bg" id="sbg"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sht">
        <span class="grab" aria-hidden="true"></span>
        <h2 id="sht">Læg på indkøbssedlen</h2>
        <p class="hint">Til ${esc(cur)} ${esc(r.servingsUnit || "personer")}. Tryk på det, du allerede har, så kommer det ikke med.</p>
        <ul class="shoppick">${ings.map(({ ing, i }) => `<li data-pick="${i}" class="${need.has(i) ? "" : "have"}" role="checkbox" aria-checked="${need.has(i)}" tabindex="0">
          <span class="box" aria-hidden="true"></span><span class="qty">${esc(fmtQty(ing, factor))}</span><span class="name">${esc(ing.name)}</span><span class="havelbl">${need.has(i) ? "" : "Har"}</span></li>`).join("")}</ul>
        <div class="row" style="justify-content:space-between">
          <button class="btn ghost" id="pickall">${need.size === ings.length ? "Jeg har intet" : "Vælg alle"}</button>
          <button class="btn primary" id="pickok" ${need.size ? "" : "disabled"}>${ICON.cart} Læg ${need.size} ${need.size === 1 ? "vare" : "varer"} på</button>
        </div>
      </div>`;
    const close = () => { $("#sheet").innerHTML = ""; };
    $("#sbg").onclick = close;
    $("#sheet").querySelectorAll("[data-pick]").forEach((li) => {
      const t = () => { const i = +li.dataset.pick; need.has(i) ? need.delete(i) : need.add(i); draw(); };
      li.onclick = t; li.onkeydown = (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); t(); } };
    });
    $("#pickall").onclick = () => { if (need.size === ings.length) need.clear(); else ings.forEach((x) => need.add(x.i)); draw(); };
    $("#pickok").onclick = () => {
      /* Husk hvad man plejer at have */
      S.pantryTouched = S.pantryTouched || new Set();
      for (const { ing, i } of ings) {
        const k = shopKeyName(ing.name); S.pantryTouched.add(k);
        S.pantry = need.has(i) ? S.pantry.filter((x) => x !== k) : [...new Set([...S.pantry, k])];
      }
      const lines = ings.filter((x) => need.has(x.i)).map(({ ing }) => ({ ...ing, amount: ing.amount != null ? ing.amount * factor : null }));
      const n = addToShop(lines, r.title);
      close();
      toast(n + (n === 1 ? " vare" : " varer") + " lagt på sedlen", "Se sedlen", () => go("indkob"));
      if (route().view === "list") render();
    };
  };
  draw();
}

  if (h === "indkob") return { view: "shop" };
  if (h.startsWith("opskrift-")) return { view: "recipe", id: h.slice(9) };
  if (h.startsWith("rediger-")) return { view: "edit", id: h.slice(8) };

}

/* ---------- Søgning på ingredienser ---------- */
const STOP = new Set(["og", "med", "eller", "i", "til", "and", "with", "or", "af"]);
/* Grov dansk/engelsk ordstamme, så "tomater" finder "tomat" og "æg" finder "æggeblommer" */
const stem = (w) => w.length > 4 ? w.replace(/(erne|ene|er|en|et|e|s)$/, "") : w;
function searchTerms(q) {
  return [...new Set(q.toLowerCase().split(/[\s,;+]+/).map((t) => t.trim()).filter((t) => t && !STOP.has(t)))];
}
function matchRecipe(r, terms) {
  if (!terms.length) return { found: [], missing: [], names: [] };
  const title = (r.title || "").toLowerCase();
  const ings = (r.ingredients || []).filter((i) => !i.section).map((i) => (i.name || "").toLowerCase());
  const found = [], missing = [], names = [];
  for (const t of terms) {
    const st = stem(t);
    const hitIng = ings.find((n) => n.includes(st));
    if (hitIng || title.includes(st) || (r.category || "").toLowerCase().includes(st)) { found.push(t); if (hitIng) names.push(hitIng); }
    else missing.push(t);
  }
  return { found, missing, names };
}
function matchLine(m) {
  if (!m || (!m.names.length && !m.missing.length)) return "";
  const ok = [...new Set(m.names)].slice(0, 3).map((n) => `<span class="ok">${esc(n.split(",")[0])}</span>`).join(", ");
  const no = m.missing.length ? ` <span class="no">mangler ${m.missing.map(esc).join(", ")}</span>` : "";
  return `<span class="match">${ok ? "Indeholder " + ok : ""}${ok && no ? " ·" : ""}${no}</span>`;
}

/* Swipe fra højre mod venstre for at slette.
   Kort swipe viser den røde skraldespand, langt swipe sletter med det samme.
   Telefoner bruger touch-hændelser (mest pålideligt i Safari og i hjemmeskærms-apps), mus bruger pointer-hændelser. */
const REVEAL = 92;
function bindCard(card) {
  const id = card.dataset.open;
  const wrap = card.parentElement;
  let x0 = 0, y0 = 0, dx = 0, base = 0, drag = false, down = false, moved = false;
  const setX = (x) => { card.style.transform = x ? `translateX(${x}px)` : ""; };
  const start = (x, y) => { down = true; drag = false; moved = false; x0 = x; y0 = y; dx = 0; base = card.classList.contains("open") ? -REVEAL : 0; };
  const move = (x, y, e) => {
    if (!down) return;
    const mx = x - x0, my = y - y0;
    if (!drag) {
      if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) { drag = true; moved = true; card.classList.add("dragging"); closeOpenCards(card); }
      else if (Math.abs(my) > 8) { down = false; return; }
      else return;
    }
    if (e && e.cancelable) e.preventDefault();
    dx = Math.min(0, base + mx);
    if (dx > -REVEAL) setX(dx); else setX(-REVEAL + (dx + REVEAL) * 0.9);
  };
  const end = () => {
    if (!down) return;
    down = false;
    if (!drag) return;
    drag = false;
    card.classList.remove("dragging");
    const w = card.offsetWidth;
    if (dx < -w * 0.5) { card.style.transform = `translateX(${-w - 24}px)`; setTimeout(() => removeWithUndo(id), 200); }
    else if (dx < -REVEAL / 2) { card.classList.add("open"); setX(-REVEAL); }
    else { card.classList.remove("open"); setX(0); }
  };
  card.addEventListener("touchstart", (e) => { const t = e.touches[0]; start(t.clientX, t.clientY); }, { passive: true });
  card.addEventListener("touchmove", (e) => { const t = e.touches[0]; move(t.clientX, t.clientY, e); }, { passive: false });
  card.addEventListener("touchend", end);
  card.addEventListener("touchcancel", end);
  card.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") start(e.clientX, e.clientY); });
  card.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") { move(e.clientX, e.clientY, null); if (drag) try { card.setPointerCapture(e.pointerId); } catch {} } });
  card.addEventListener("pointerup", (e) => { if (e.pointerType === "mouse") end(); });
  card.addEventListener("click", (e) => {
    if (moved) { moved = false; return; }
    if (e.target.closest(".fav")) { e.stopPropagation(); return toggleFavorite(id); }
    if (card.classList.contains("open")) { card.classList.remove("open"); setX(0); return; }
    go("opskrift-" + id);
  });
  card.addEventListener("keydown", (e) => {
    if (e.target !== card) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go("opskrift-" + id); }
    if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeWithUndo(id); }
  });
  wrap.querySelector("[data-del]").onclick = () => removeWithUndo(id);
}
function closeOpenCards(except) {
  document.querySelectorAll(".card.open").forEach((c) => { if (c !== except) { c.classList.remove("open"); c.style.transform = ""; } });
}
async function removeWithUndo(id) {
  const ex = EXAMPLES.find((x) => x.id === id);
  if (ex) {
    S.hiddenExamples.push(id); lsSet("mk:hiddenExamples", S.hiddenExamples); render();
    return toast("Eksemplet er fjernet", "Fortryd", () => { S.hiddenExamples = S.hiddenExamples.filter((x) => x !== id); lsSet("mk:hiddenExamples", S.hiddenExamples); render(); });
  }
  const r = S.recipes.find((x) => x.id === id);
  if (!r) return;
  const copy = JSON.parse(JSON.stringify(r));
  if (await deleteRecipe(id)) {
    render();
    toast("«" + copy.title + "» er slettet", "Fortryd", async () => { await saveRecipe(copy, true); render(); });
  } else render();
}
async function toggleFavorite(id) {
  const r = S.recipes.find((x) => x.id === id);
  if (!r) return;
  const next = { ...JSON.parse(JSON.stringify(r)), favorite: !r.favorite };
  if (S.mode === "db" || S.mode === "cloud") { Object.assign(r, { favorite: next.favorite }); render(); }
  if (await saveRecipe(next, true)) { toast(next.favorite ? "Tilføjet til favoritter" : "Fjernet fra favoritter"); render(); }
}

/* ---------- Deling ---------- */
/* En delt opskrift pakkes komprimeret ind i linket (?r=…), så den kan åbnes uden en server. */
const APP_URL = location.origin + location.pathname;
const b64url = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64url = (str) => { const b = atob(str.replace(/-/g, "+").replace(/_/g, "/")); const out = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) out[i] = b.charCodeAt(i); return out; };
async function encodeRecipe(r) {
  const data = { t: r.title, d: r.description || "", s: r.servings, u: r.servingsUnit, tm: r.time || "", c: r.category || "", src: r.source || "", img: r.image || "",
    i: (r.ingredients || []).map((x) => (x.section ? [x.section] : [x.amount, x.amountMax, x.unit, x.name])), st: r.steps || [], n: r.notes || "" };
  let bytes = new TextEncoder().encode(JSON.stringify(data)), tag = "j";
  if (window.CompressionStream) {
    try { bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); tag = "z"; } catch {}
  }
  return tag + b64url(bytes);
}
async function decodeRecipe(code) {
  let bytes = unb64url(code.slice(1));
  if (code[0] === "z") bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  const d = JSON.parse(new TextDecoder().decode(bytes));
  const str = (v, max) => String(v ?? "").slice(0, max);
  return {
    id: "delt", shared: true, title: str(d.t, 200) || "Delt opskrift", description: str(d.d, 600),
    servings: Math.max(1, Math.round(Number(d.s) || 4)), servingsUnit: str(d.u, 30) || "personer", time: str(d.tm, 60), category: str(d.c, 30),
    source: /^https?:\/\//.test(d.src || "") ? str(d.src, 2000) : "", image: /^https?:\/\//.test(d.img || "") ? str(d.img, 2000) : "",
    ingredients: (Array.isArray(d.i) ? d.i : []).slice(0, 200).map((x) => (Array.isArray(x) && x.length === 1 ? { section: str(x[0], 100) } : normalizeIngredient({ amount: x[0], amountMax: x[1], unit: str(x[2], 20), name: str(x[3], 200) }))),
    steps: (Array.isArray(d.st) ? d.st : []).slice(0, 100).map((x) => str(x, 2000)), notes: str(d.n, 4000)
  };
}
async function shareLink({ title, text, url }) {
  if (navigator.share) {
    try { await navigator.share({ title, text, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const all = text + "\n" + url;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(url); toast("Linket er kopieret. Sæt det ind i en besked."); return; } catch {}
  }
  if ($("#confirm")) showCopyFallback(all); else toast("Linket kunne ikke deles");
}
async function shareRecipe(r, factor, cur) {
  if (IN_CLAUDE) {
    /* På claude.ai kan links ikke åbne appen, så opskriften deles som tekst */
    const text = recipeAsText(r, factor, cur);
    if (navigator.clipboard && navigator.clipboard.writeText) { try { await navigator.clipboard.writeText(text); return toast("Opskriften er kopieret som tekst. Sæt den ind i en besked."); } catch {} }
    return showCopyFallback(text);
  }
  const code = await encodeRecipe(r);
  await shareLink({ title: r.title, text: "Her er opskriften på " + r.title + " fra min kogebog:", url: APP_URL + "?r=" + code });
}

function showCopyFallback(text) {
  $("#confirm").innerHTML = `<div class="field"><label for="cpy">Markér og kopiér teksten</label><textarea class="input tall" id="cpy" readonly>${esc(text)}</textarea></div>`;
  const t = $("#cpy"); t.focus(); t.select();
}
function recipeAsText(r, factor, cur) {
  const out = [r.title, "", `Til ${cur} ${r.servingsUnit || "personer"}`, "", "Ingredienser:"];
  for (const ing of r.ingredients || []) out.push(ing.section ? "\n" + ing.section + ":" : "- " + [fmtQty(ing, factor), ing.name].filter(Boolean).join(" "));
  out.push("", "Fremgangsmåde:");
  (r.steps || []).forEach((s, i) => out.push(`${i + 1}. ${s}`));
  if (r.notes) out.push("", "Noter:", r.notes);
  return out.join("\n");
}

/* ---------- Hent opskrift fra et link ---------- */
/* Browseren må ikke læse andre sider direkte, så siden hentes gennem offentlige tjenester.
   De prøves én ad gangen, indtil én giver en opskrift med ingredienser.
   Svaret parses med DOMParser (kører ingen scripts) og kun tekst bruges videre. */
async function tfetch(u, opts = {}, ms = 14000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(u, { ...opts, signal: ctl.signal }); if (!r.ok) throw { code: "http", status: r.status }; return await r.text(); }
  finally { clearTimeout(t); }
}
const blockedPage = (h) => /just a moment|cf-chl|challenge-platform|attention required|access denied|captcha/i.test(h.slice(0, 6000)) && !/ld\+json/i.test(h);
const SOURCES = [
  /* Jina Reader henter siden med en rigtig browser, så den kommer forbi de fleste blokeringer */
  { kind: "html", get: (u) => tfetch("https://r.jina.ai/" + u, { headers: { "X-Return-Format": "html" } }, 25000) },
  { kind: "html", get: (u) => tfetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(u)) },
  { kind: "html", get: async (u) => JSON.parse(await tfetch("https://api.allorigins.win/get?url=" + encodeURIComponent(u))).contents || "" },
  { kind: "html", get: (u) => tfetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)) },
  { kind: "html", get: (u) => tfetch("https://corsproxy.io/?url=" + encodeURIComponent(u)) },
  /* Sidste udvej: sidens tekst som markdown */
  { kind: "md", get: (u) => tfetch("https://r.jina.ai/" + u, {}, 25000) }
];
async function fetchRecipe(url, onTry) {
  let best = null;
  for (let i = 0; i < SOURCES.length; i++) {
    const src = SOURCES[i];
    if (onTry) onTry(i);
    try {
      const body = await src.get(url);
      if (!body || body.length < 200) continue;
      if (src.kind === "html" && blockedPage(body)) continue;
      const d = src.kind === "html" ? parseRecipeHtml(body, url) : parseMarkdownRecipe(body, url);
      if (d.ingredients.length >= 2 && d.steps.length) return d;
      if (d.ingredients.length && (!best || d.ingredients.length > best.ingredients.length)) best = d;
    } catch {}
  }
  if (best) return best;
  throw { code: "fetch" };
}
function parseMarkdownRecipe(md, url) {
  const title = (md.match(/^Title:\s*(.+)$/m) || [])[1] || "";
  let body = md.includes("Markdown Content:") ? md.split("Markdown Content:").slice(1).join("") : md;
  body = body
    .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/\*\*|__/g, "")
    .replace(/^\s*[-*+]\s+\[[ x]\]\s*/gim, "- ");
  const d = heuristicParse(body);
  if (title) d.title = title.trim();
  d.source = url; d.image = "";
  return d;
}
const strip = (s) => (s == null ? "" : new DOMParser().parseFromString(String(s), "text/html").documentElement.textContent.replace(/\s+/g, " ").trim());
function findRecipeNode(j) {
  if (!j || typeof j !== "object") return null;
  if (Array.isArray(j)) { for (const x of j) { const r = findRecipeNode(x); if (r) return r; } return null; }
  const t = j["@type"];
  if (t === "Recipe" || (Array.isArray(t) && t.includes("Recipe"))) return j;
  return findRecipeNode(j["@graph"]) || findRecipeNode(j.mainEntity) || findRecipeNode(j.mainEntityOfPage);
}
function isoDuration(s) {
  const m = String(s || "").match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);
  if (!m) return 0;
  return (+m[1] || 0) * 1440 + (+m[2] || 0) * 60 + (+m[3] || 0);
}
function fmtMinutes(min) {
  if (!min) return "";
  const h = Math.floor(min / 60), m = min % 60;
  return h ? (h + " t" + (m ? " " + m + " min" : "")) : m + " min";
}
function flattenSteps(ins) {
  if (!ins) return [];
  if (typeof ins === "string") return parseSteps(strip(ins).replace(/(\.)\s+(?=\d+[.)]\s)/g, "$1\n"));
  if (Array.isArray(ins)) return ins.flatMap(flattenSteps);
  if (typeof ins === "object") {
    if (ins.itemListElement) return flattenSteps(ins.itemListElement);
    const t = strip(ins.text || ins.name || "");
    return t ? [t] : [];
  }
  return [];
}
function pickImage(img) {
  if (!img) return "";
  if (typeof img === "string") return /^https?:\/\//.test(img) ? img : "";
  if (Array.isArray(img)) { for (const x of img) { const u = pickImage(x); if (u) return u; } return ""; }
  return pickImage(img.url || img.contentUrl);
}
function parseYield(y) {
  const list = Array.isArray(y) ? y : [y];
  for (const v of list) {
    const s = String(v ?? "");
    const m = s.match(/(\d+)/);
    if (m) return { servings: +m[1], unit: /(stk|piece|cookie|muffin|bar|roll|bolle|biscuit|slice|skive|loa(f|ves)|brød|kage|cake|pie|tærte|pan|form|glas|glass|drink|serving|portion)/i.test(s) && !/(serving|portion|person|people)/i.test(s) ? "stk." : (/portion|serving/i.test(s) ? "portioner" : "personer") };
  }
  return { servings: 4, unit: "personer" };
}
function pageText(doc) {
  doc.querySelectorAll("script,style,noscript,nav,header,footer,aside,form,iframe,svg,button").forEach((e) => e.remove());
  doc.querySelectorAll("br").forEach((b) => b.replaceWith("\n"));
  doc.querySelectorAll("p,li,h1,h2,h3,h4,h5,h6,div,tr,section,article").forEach((e) => e.append("\n"));
  const root = doc.querySelector("[class*=recipe]") || doc.querySelector("article") || doc.querySelector("main") || doc.body;
  return (root ? root.textContent : "").split("\n").map((l) => l.replace(/\s+/g, " ").trim()).filter((l, i, a) => l || a[i - 1]).join("\n");
}
function parseRecipeHtml(html, url) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  let rec = null;
  for (const sc of doc.querySelectorAll('script[type="application/ld+json"]')) {
    try { rec = findRecipeNode(JSON.parse(sc.textContent.replace(/[\u0000-\u001f]+/g, " "))); } catch {}
    if (rec) break;
  }
  const pageTitle = strip(doc.querySelector('meta[property="og:title"]')?.getAttribute("content") || doc.title);
  const ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute("content") || "";
  if (rec) {
    const y = parseYield(rec.recipeYield);
    const time = fmtMinutes(isoDuration(rec.totalTime) || (isoDuration(rec.prepTime) + isoDuration(rec.cookTime)));
    const cats = [rec.recipeCategory, rec.recipeCourse, rec.keywords].flat().filter(Boolean).map(String).join(" ");
    const title = strip(rec.name) || pageTitle;
    const desc = strip(rec.description).slice(0, 300);
    return {
      title, description: desc, servings: y.servings, servingsUnit: y.unit, time,
      category: guessCategory(cats, title + " " + desc),
      ingredients: [rec.recipeIngredient || rec.ingredients || []].flat().map((i) => parseIngredientLine(strip(i))).filter(Boolean),
      steps: flattenSteps(rec.recipeInstructions),
      notes: "", image: pickImage(rec.image) || ogImage, source: url
    };
  }
  /* Ingen strukturerede data: prøv microdata, ellers sidens tekst */
  const micro = [...doc.querySelectorAll('[itemprop="recipeIngredient"],[itemprop="ingredients"]')].map((e) => strip(e.textContent));
  if (micro.length) {
    const steps = [...doc.querySelectorAll('[itemprop="recipeInstructions"]')].flatMap((e) => parseSteps(e.textContent));
    return { title: pageTitle, description: "", servings: 4, servingsUnit: "personer", time: "", category: guessCategory("", pageTitle),
      ingredients: micro.map(parseIngredientLine).filter(Boolean), steps, notes: "", image: ogImage, source: url };
  }
  const d = heuristicParse(pageText(doc));
  if (pageTitle) d.title = pageTitle;
  d.image = ogImage; d.source = url;
  return d;
}

/* ---------- Oversættelse (engelsk -> dansk) ---------- */
const EN_WORDS = new Set("the and of with to in for until into add stir minutes heat cup cups teaspoon tablespoon or on from bake mix large salt pepper oil water sugar flour butter chopped place pan oven serve remove about over cook".split(" "));
const DA_WORDS = new Set("og med til i en et af på eller som det minutter tilsæt rør peber smør mel sukker vand hakket server ovnen gryde bag lad skær".split(" "));
function looksEnglish(text) {
  const w = String(text).toLowerCase().match(/[a-zæøå]+/g) || [];
  let en = 0, da = 0;
  for (const x of w) { if (EN_WORDS.has(x)) en++; if (DA_WORDS.has(x)) da++; }
  return en >= 3 && en > da * 1.5;
}
async function gtx(text) {
  try {
    const j = JSON.parse(await tfetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=da&dt=t&q=" + encodeURIComponent(text)));
    return (j[0] || []).map((x) => x[0]).join("");
  } catch {
    /* Reserve: MyMemory tager højst ca. 500 tegn ad gangen, så linjerne oversættes i små bidder */
    const out = [];
    for (const line of text.split("\n")) {
      let part = "", res = [];
      for (const w of line.split(" ")) {
        if ((part + " " + w).length > 450) { res.push(await mm(part)); part = w; } else part = part ? part + " " + w : w;
      }
      if (part) res.push(await mm(part));
      out.push(res.join(" "));
    }
    return out.join("\n");
  }
}
async function mm(t) {
  const j = JSON.parse(await tfetch("https://api.mymemory.translated.net/get?langpair=en|da&q=" + encodeURIComponent(t)));
  const r = j && j.responseData && j.responseData.translatedText;
  if (!r || j.responseStatus !== 200) throw { code: "translate" };
  return r;
}
async function translateList(items) {
  const out = items.slice();
  const idx = items.map((s, i) => (s && s.trim() ? i : -1)).filter((i) => i >= 0);
  let chunk = [], len = 0;
  const flush = async () => {
    if (!chunk.length) return;
    const res = (await gtx(chunk.map((i) => items[i].replace(/\n/g, " ")).join("\n"))).split("\n");
    if (res.length === chunk.length) chunk.forEach((i, k) => (out[i] = res[k].trim()));
    else for (const i of chunk) out[i] = (await gtx(items[i])).trim();
    chunk = []; len = 0;
  };
  for (const i of idx) {
    if (len + items[i].length > 1400) await flush();
    chunk.push(i); len += items[i].length + 1;
  }
  await flush();
  return out;
}
const fToC = (s) => String(s || "").replace(/(\d{3})\s*(?:°|º|degrees?)?\s*F\b/gi, (m, f) => Math.round(((f - 32) * 5) / 9 / 5) * 5 + " °C");
async function translateDraft(d) {
  d.steps = d.steps.map(fToC); d.notes = fToC(d.notes);
  const ings = d.ingredients;
  const items = [d.title, d.description, d.notes, d.time, ...ings.map((i) => i.section || i.name), ...d.steps];
  const tr = await translateList(items);
  let k = 0;
  d.title = tr[k++]; d.description = tr[k++]; d.notes = tr[k++]; d.time = tr[k++];
  d.ingredients = ings.map((i) => (i.section ? { section: tr[k++] } : { ...i, name: tr[k++] }));
  d.steps = d.steps.map(() => tr[k++]);
  return d;
}

/* ---------- Import-visning ---------- */
let importMode = IN_CLAUDE ? "text" : "link";
const prefs = lsGet("mk:prefs", { translate: true });
function renderImport() {
  setTop(`${backBtn()}<div class="brand">${IN_CLAUDE ? "Indsæt opskrift" : "Tilføj fra nettet"}</div>`);
  setFab("");
  const ai = IN_CLAUDE && !!S.sample;
  const draftText = lsGet("mk:importDraft", "");
  const tabs = IN_CLAUDE ? (ai && S.sampleImages ? [["text", "Tekst"], ["img", "Skærmbillede"]] : []) : [["link", "Link"], ["text", "Tekst"]];
  if (!tabs.some((t) => t[0] === importMode)) importMode = tabs.length ? tabs[0][0] : "text";
  const shared = S.sharedLink || "";
  $("#main").innerHTML = `
    <div class="stack">
      ${tabs.length ? `<div class="seg" role="group" aria-label="Kilde">${tabs.map(([k, l]) => `<button data-mode="${k}" aria-pressed="${importMode === k}">${l}</button>`).join("")}</div>` : ""}

      <div class="stack" ${importMode === "link" ? "" : "hidden"}>
        <p class="note">Kopiér linket til opskriften fra browseren og sæt det ind. Appen henter titel, antal, ingredienser og fremgangsmåde og sætter det op i det faste format.</p>
        <div class="field">
          <label for="url">Link til opskriften</label>
          <div class="linkrow">
            <input class="input" id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://www.valdemarsro.dk/…" value="${esc(shared)}">
            ${navigator.clipboard && navigator.clipboard.readText ? `<button class="btn" id="pasteurl" type="button">${ICON.paste} Sæt ind</button>` : ""}
          </div>
        </div>
      </div>

      <div class="stack" ${importMode === "text" ? "" : "hidden"}>
        <p class="note">${IN_CLAUDE ? "Åbn opskriften på hjemmesiden, markér og kopiér teksten, og sæt den ind herunder. " + (ai ? "Claude rydder op og sætter den ind i det faste format." : "Appen finder ingredienser og fremgangsmåde.") : "Virker et link ikke, kan du kopiere opskriftens tekst fra siden og sætte den ind her."} Du kan rette alt bagefter.</p>
        <div class="field">
          <label for="raw">Opskriftens tekst</label>
          <textarea class="input tall" id="raw" placeholder="Ingredienser&#10;2 cups flour&#10;1 tsp salt&#10;…&#10;&#10;Fremgangsmåde&#10;1. Bland mel og salt…">${esc(draftText)}</textarea>
        </div>
        <div class="field"><label for="src">Link til siden</label><input class="input" id="src" type="url" inputmode="url" placeholder="https:// (valgfrit, gemmes som kilde)"></div>
      </div>

      <div class="field" ${importMode === "img" ? "" : "hidden"}>
        <label for="img">Skærmbillede eller foto af opskriften</label>
        <input class="input" id="img" type="file" accept="image/*">
      </div>

      ${!IN_CLAUDE || ai ? `<label class="check"><input type="checkbox" id="tr" ${prefs.translate ? "checked" : ""}> Oversæt engelske opskrifter til dansk</label>` : ""}
      <p class="note err" id="err" hidden></p>
      <div class="row">
        <button class="btn primary" id="go">${importMode === "link" ? "Hent opskrift" : (ai ? "Ensret med Claude" : "Fortolk opskriften")}</button>
        ${ai && importMode === "text" ? `<button class="btn" id="local">Fortolk uden Claude</button>` : ""}
      </div>
      ${!IN_CLAUDE ? `<p class="status">På Android kan du også trykke Del på en opskrift i browseren og vælge Kogebog.</p>` : ""}
    </div>`;

  const raw = $("#raw"), err = $("#err");
  raw.addEventListener("input", () => lsSet("mk:importDraft", raw.value));
  $("#main").querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { importMode = b.dataset.mode; renderImport(); }));
  if ($("#tr")) $("#tr").onchange = (e) => { prefs.translate = e.target.checked; lsSet("mk:prefs", prefs); };
  if ($("#pasteurl")) $("#pasteurl").onclick = async () => {
    try { const t = await navigator.clipboard.readText(); const m = t.match(/https?:\/\/\S+/); $("#url").value = m ? m[0] : t.trim(); }
    catch { $("#url").focus(); toast("Tryk og hold i feltet for at sætte ind"); }
  };
  const fail = (m) => { err.textContent = m; err.hidden = false; };
  const btn = $("#go");
  const busy = (label) => { btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span> ${esc(label)}`; };
  const idle = () => { btn.disabled = false; btn.textContent = importMode === "link" ? "Hent opskrift" : (ai ? "Ensret med Claude" : "Fortolk opskriften"); };
  const wantTranslate = () => !!($("#tr") && $("#tr").checked);
  const srcVal = () => { let s = $("#src").value.trim(); if (s && !/^https?:\/\//i.test(s)) s = "https://" + s; return s; };

  /* Fælles afslutning for link og tekst uden Claude: oversæt evt. og åbn redigering */
  const finishLocal = async (d, source) => {
    let draft = toDraft(d, source);
    draft.image = d.image || "";
    if (!IN_CLAUDE && wantTranslate() && looksEnglish([draft.title, ...draft.ingredients.map((i) => i.name || ""), ...draft.steps].join(" "))) {
      busy("Oversætter…");
      try { draft = await translateDraft(draft); }
      catch { toast("Oversættelsen mislykkedes. Opskriften er sat ind på engelsk."); }
    }
    lsSet("mk:importDraft", ""); S.sharedLink = ""; S.draft = draft; go("ny");
  };
  const doText = async () => {
    if (!raw.value.trim()) return fail("Sæt opskriftens tekst ind først.");
    const d = heuristicParse(raw.value);
    if (!d.ingredients.length) return fail("Jeg kunne ikke finde ingredienserne. Tjek at teksten indeholder en ingrediensliste, eller skriv opskriften selv.");
    await finishLocal(d, srcVal());
  };
  const doLink = async () => {
    let url = $("#url").value.trim();
    const m = url.match(/https?:\/\/\S+/); if (m) url = m[0];
    else if (url && !/\s/.test(url) && url.includes(".")) url = "https://" + url;
    else return fail("Sæt et link ind, der starter med https://");
    busy("Henter siden…");
    let d;
    try { d = await fetchRecipe(url, (i) => { if (i > 0) busy("Prøver en anden vej… (" + (i + 1) + "/" + SOURCES.length + ")"); }); }
    catch { idle(); return fail("Opskriften kunne ikke hentes fra siden. Nogle sider lukker ikke apps ind. Åbn siden, kopiér opskriftens tekst, og brug fanen Tekst."); }
    await finishLocal(d, url);
  };
  if ($("#local")) $("#local").onclick = doText;
  btn.onclick = async () => {
    err.hidden = true;
    if (importMode === "link") return doLink();
    if (!ai) return doText();
    const useImg = importMode === "img";
    const file = useImg ? $("#img").files[0] : null;
    if (useImg && !file) return fail("Vælg et billede af opskriften.");
    if (!useImg && !raw.value.trim()) return fail("Sæt opskriftens tekst ind først.");
    busy("Ensretter…");
    try {
      const prompt = IMPORT_PROMPT(wantTranslate()) + (useImg ? "\n\nOpskriften står på det vedhæftede billede." : "\n\nTekst:\n" + raw.value.slice(0, 40000));
      const obj = await S.sample.json(prompt, useImg ? { images: [file], modelTier: "default" } : { modelTier: "default" });
      const d = toDraft(obj, useImg ? "" : srcVal());
      if (!d.ingredients.length) throw { code: "empty" };
      lsSet("mk:importDraft", ""); S.draft = d; go("ny");
    } catch (e) {
      idle();
      const c = e && e.code;
      if (c === "not_granted") { S.sample = null; fail("Claude har ikke fået lov til at hjælpe. Brug Fortolk uden Claude."); }
      else if (c === "rate_limited") fail("Claude har travlt lige nu. Vent et øjeblik og prøv igen, eller fortolk uden Claude.");
      else if (c === "empty" || c === "invalid_json") fail("Der blev ikke fundet en opskrift i teksten. Prøv at kopiere selve opskriften med.");
      else fail("Det lykkedes ikke at ensrette opskriften. Prøv igen, eller fortolk uden Claude.");
    }
  };
  if (shared && importMode === "link" && !S.autoFetched) { S.autoFetched = true; doLink(); }
}

/* ---------- Start ---------- */
/* Invitation til fælles kogebog: ?kogebog=… */
try {
  const inv = new URLSearchParams(location.search).get("kogebog");
  if (inv && !IN_CLAUDE) {
    history.replaceState(null, "", location.pathname);
    try {
      const { config, code } = readInvite(inv);
      lsSet("mk:cloud", { config, code });
      const standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
      if (!standalone) S.inviteNote = location.origin + location.pathname + "?kogebog=" + inv;
      else setTimeout(() => toast("Du er nu med i den fælles kogebog"), 600);
    } catch { setTimeout(() => toast("Invitationslinket er ugyldigt. Bed om et nyt."), 600); }
  }
} catch {}
/* Delt opskrift: ?r=… */
try {
  const code = new URLSearchParams(location.search).get("r");
  if (code) {
    history.replaceState(null, "", location.pathname + "#opskrift-delt");
    decodeRecipe(code).then((r) => { S.sharedRecipe = r; render(); }).catch(() => { toast("Linket til opskriften er ugyldigt eller blev klippet over"); go(""); });
  }
} catch {}
/* Delt link fra Android (Web Share Target): ?url=…&text=… */
try {
  const sp = new URLSearchParams(location.search);
  if (sp.get("r")) throw 0;
  const sharedText = [sp.get("url"), sp.get("text"), sp.get("title")].filter(Boolean).join(" ");
  const m = sharedText.match(/https?:\/\/\S+/);
  if (m) { S.sharedLink = m[0]; history.replaceState(null, "", location.pathname + "#importer"); }
} catch {}
render();
initStore();
initSample();
})();
